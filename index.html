<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>笔记文件总览</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fa;
      --panel: #fff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #57606a;
      --accent: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 {
      margin: 0;
      font-size: 18px;
    }
    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 70px);
    }
    aside, main {
      overflow: auto;
      background: var(--panel);
    }
    aside {
      border-right: 1px solid var(--border);
      padding: 12px;
    }
    main {
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }
    .hint {
      color: var(--muted);
      font-size: 14px;
    }
    .file-btn {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      border-radius: 6px;
      padding: 6px 8px;
      margin: 2px 0;
      cursor: pointer;
    }
    .file-btn:hover {
      border-color: var(--border);
      background: rgba(9, 105, 218, 0.08);
    }
    .file-btn.active {
      border-color: var(--accent);
      background: rgba(9, 105, 218, 0.15);
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; height: auto; }
      aside { border-right: 0; border-bottom: 1px solid var(--border); max-height: 38vh; }
      main { min-height: 60vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>仓库文件总览</h1>
    <p id="repoInfo">正在识别仓库信息...</p>
    <p id="manualRepo" style="display:none; margin:8px 0 0;">
      <input id="ownerInput" placeholder="owner" style="width:110px;" />
      /
      <input id="repoInput" placeholder="repo" style="width:150px;" />
      <button id="loadBtn" type="button">加载仓库</button>
    </p>
  </header>
  <div class="layout">
    <aside>
      <div id="fileList" class="hint">正在加载文件列表...</div>
    </aside>
    <main id="viewer" class="hint">点击左侧文件进行查看</main>
  </div>

  <script>
    const repoInfoEl = document.getElementById("repoInfo");
    const manualRepoEl = document.getElementById("manualRepo");
    const ownerInputEl = document.getElementById("ownerInput");
    const repoInputEl = document.getElementById("repoInput");
    const loadBtnEl = document.getElementById("loadBtn");
    const fileListEl = document.getElementById("fileList");
    const viewerEl = document.getElementById("viewer");

    function parseRepoFromPath() {
      const parts = location.pathname.split("/").filter(Boolean);
      if (parts.length >= 2) return { owner: parts[0], repo: parts[1] };
      return null;
    }

    async function fetchDefaultBranch(owner, repo) {
      const response = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
      if (!response.ok) throw new Error("无法读取仓库信息");
      const data = await response.json();
      return data.default_branch;
    }

    async function fetchFileTree(owner, repo, branch) {
      const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`);
      if (!response.ok) throw new Error("无法读取文件树");
      const data = await response.json();
      return (data.tree || []).filter(item => item.type === "blob").map(item => item.path);
    }

    function renderMarkdown(source) {
      const html = source
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/^### (.*)$/gm, "<h3>$1</h3>")
        .replace(/^## (.*)$/gm, "<h2>$1</h2>")
        .replace(/^# (.*)$/gm, "<h1>$1</h1>")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.*?)\*/g, "<em>$1</em>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\n/g, "<br>");
      return html;
    }

    async function showFile(owner, repo, branch, filePath, button) {
      document.querySelectorAll(".file-btn.active").forEach(el => el.classList.remove("active"));
      button.classList.add("active");
      viewerEl.className = "";
      viewerEl.textContent = `正在加载：${filePath}`;
      const url = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${filePath}`;
      const response = await fetch(url);
      if (!response.ok) {
        viewerEl.className = "hint";
        viewerEl.textContent = `读取失败：${filePath}`;
        return;
      }
      const text = await response.text();
      if (/\.md$/i.test(filePath)) {
        viewerEl.innerHTML = renderMarkdown(text);
      } else {
        viewerEl.textContent = text;
      }
    }

    async function loadRepo(owner, repoName) {
      repoInfoEl.textContent = `${owner}/${repoName}`;
      try {
        const branch = await fetchDefaultBranch(owner, repoName);
        const files = await fetchFileTree(owner, repoName, branch);
        if (!files.length) {
          fileListEl.textContent = "仓库中没有可展示的文件。";
          return;
        }
        fileListEl.textContent = "";
        files.forEach(filePath => {
          const button = document.createElement("button");
          button.className = "file-btn";
          button.textContent = filePath;
          button.addEventListener("click", () => {
            showFile(owner, repoName, branch, filePath, button).catch(err => {
              viewerEl.className = "hint";
              viewerEl.textContent = `打开失败：${err.message}`;
            });
          });
          fileListEl.appendChild(button);
        });
      } catch (err) {
        fileListEl.className = "hint";
        fileListEl.textContent = `加载失败：${err.message}`;
      }
    }

    async function start() {
      const repo = parseRepoFromPath();
      if (!repo) {
        repoInfoEl.textContent = "未自动识别仓库，请手动输入 owner/repo";
        manualRepoEl.style.display = "block";
        fileListEl.textContent = "等待输入仓库名。";
        return;
      }
      await loadRepo(repo.owner, repo.repo);
    }

    loadBtnEl.addEventListener("click", () => {
      const owner = ownerInputEl.value.trim();
      const repoName = repoInputEl.value.trim();
      if (!owner || !repoName) return;
      manualRepoEl.style.display = "block";
      fileListEl.textContent = "正在加载文件列表...";
      viewerEl.className = "hint";
      viewerEl.textContent = "点击左侧文件进行查看";
      loadRepo(owner, repoName);
    });

    start();
  </script>
</body>
</html>
